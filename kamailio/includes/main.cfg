request_route {
    route(OPTIONS_CHECK);

    route(NATMANAGE);
    route(CANCELING);
    
    if (route(WITHINDLG)) {
        /*
        *if (uri == myself) {
        *    xlog("L_INFO", "URI is myself, try lookup");
        *    route(LOCATION);
        *}
        */
        route(RELAY);
    }
    route(AUTH);
    route(REGISTRAR);
    route(ROUTING);
    if (!route(LOCATION)) {
        xlog("L_INFO", "Lookup was failed, try call to pstn");
        if (!route(TO_PSTN)) {
            xlog("L_INFO", "TO_PSTN was failed");
            sl_send_reply("404", "No GW");
            exit;
        }
        //exit;
    }
    route(RELAY);
    exit;
}
