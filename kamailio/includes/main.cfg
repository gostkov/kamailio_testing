request_route {
    route(CLASSIFY_SOURCE);
    route(CANCELING);
    
    if (route(WITHINDLG)) {
        route(RELAY);
        exit;
    }
    
    route(ROUTING);
    if issflagset(FLAG_INTERNALLY_SOURCED) {
        if (!route(LOCATION)) {
            xlog("L_INFO", "Lookup was failed, try call to pstn");
            //if (!route(TO_PSTN)) {
            //    xlog("L_INFO", "TO_PSTN was failed");
            //    sl_send_reply("404", "No GW");
            //    exit;
            //}
            route(VIA_REG);
        }
    } else {
        route(AUTH);
        route(REGISTRAR);
        if (!route(DISPATCH)) exit;
    }    
    route(RELAY);
    exit;
}
