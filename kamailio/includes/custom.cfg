route[OPTIONS_CHECK] {
    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }
}

route[AUTH] {
    if (is_method("REGISTER") || (from_uri == myself)) {        
        if (!auth_check("$fd", "subscriber", "1")) {
            auth_challenge("$fd", "0");
            exit;
        }
        consume_credentials();
    } else {
        xlog("[AUTH] not register request and not for myself");
        exit;
    }
}

route[REGISTRAR] {
    if (!is_method("REGISTER")) {
        return;
    }

    if (!save("location")) {
        sl_reply_error();
    }
    exit;
}

route[NATMANAGE] {
    // force_rport();
    if (is_request() && is_method("REGISTER")) {        
        fix_nated_register();
        xlog("L_INFO", "[NATMANAGE] save received: $avp(RECEIVED) for REGISTER");
        return;
    }
    // xlog("L_INFO", "[NATMANAGE] call fix_nated_contact");
    // fix_nated_contact();
    
}

route[FIXCONTACT] {
    if !isflagset(FLAG_TO_PROVIDER) && !issflagset(FLAG_INTERNALLY_SOURCED) {
        xlog("L_INFO", "[FIXCONTACT] call fix_nated_contact");
        fix_nated_contact();
        return;
    }
}

route[LOCATION] {
    if(!lookup("location")) {
        // sl_send_reply("404", "Not Found");
        return (-1);
    }
    return (1);
}

route[RELAY] {
    xlog("L_INFO", "[RELAY] $ru");
    if (is_method("INVITE")) {
        if (!t_is_set("failure_route")) {
            xlog("L_INFO", "setting t_on_failure");
            t_on_failure("MANAGE_FAILURE");
        }
    }
    if (!t_is_set("branch_route")) {
        xlog("L_INFO", "[RELAY] call t_on_branch");
        t_on_branch("MANAGE_BRANCH");
    }

    if(!t_relay()) {
        xlog("L_INFO", "[RELAY] relay error");
        sl_reply_error();
    }
    exit;
}

route[ROUTING] {
    if (is_method("INVITE") && !has_totag()) {
        xlog("L_INFO", "[ROUTING] remove Route headers");
        remove_hf("Route");
        record_route();
    }
}

route[WITHINDLG] {
    if (!has_totag()) {
        xlog("L_INFO", "[WITHINDLG] no totag, not in-dialog, return");
        return (-1);
    }
            
    if (is_method("BYE")) {           
        if(uac_reg_lookup("$rU", "$ru")) {
            xlog("L_INFO", "[WITHINDLG] uac_reg_lookup success! call lookup()");
            lookup("location");
        } else {
            xlog("L_INFO", "[WITHINDLG] fail lookup rU[$rU]");
        }
    }

    if (loose_route()) {
        //handle_ruri_alias();
        xlog("L_INFO", "[WITHINDLG] loose routing.");
        return (1);
    }

    if (is_method("ACK")) {
        xlog("L_INFO", "[WITHINDLG] is ACK, checking transaction");
        if (t_check_trans()) {
            xlog("L_INFO", "[WITHINDLG] transaction exist");
        
            return (1);
        } else {
            xlog("L_INFO", "[WITHINDLG] transaction doesn't exist");
        
            exit;
        }
    }
    sl_send_reply("404", "Not here");
    exit;
}

route[CANCELING] {
    if (!is_method("CANCEL")) {
        return;
    }
    if (!t_check_trans()) {
        exit;
    }
}

route[SDPMANAGE] {
    if ((is_request() && is_method("BYE")) || (is_reply() && $rs > 299)) {
        xlog("L_INFO", "[SDPMANAGE] call rtpengine_manage for removing session");
        rtpengine_manage();
        return;
    }

    if ($rb == $null || $rb == "") {
        xlog("L_INFO", "[SDPMANAGE] request body is empty, skip");
        return;
    }
    xlog("L_INFO", "[SDPMANAGE] call rtpengine_manage for session - direction[$avp(direction)]");
    rtpengine_manage("replace-origin replace-session-connection SIP-source-address $avp(direction)");
}

route[DISPATCH] {
    if (!ds_select_dst(GATEWAYS_SET, 4)) {
        send_reply("404", "No destination");
        return (-1);
    }
    return (1);
}

