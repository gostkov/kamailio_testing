route[TO_PSTN] {
    route(SET_CALLERID);
    if (!cr_route("default", "test", "$rU", "$rU", "call_id")) {
        return (-1);
    }
    xlog("L_INFO", "cr_route working");
}

route[VIA_REG] {
    setflag(FLAG_TO_PROVIDER);
    dlg_manage();
    sql_pvquery("ca", "SELECT r_username, auth_username, auth_password, realm, l_domain, r_domain FROM uacreg", "$avp(fromName), $avp(uname), $avp(passwd), $avp(realm), $avp(l_ipaddr), $avp(dst_ipaddr)");

    xlog("L_INFO", "TEST $avp(fromName), $avp(uname), $avp(passwd), $avp(realm), $avp(l_ipaddr), $avp(dst_ipaddr) ");
    
    //uac_replace_from("sip:" + $avp(fromName) + "@" + $avp(dst_ipaddr));
    //uac_replace_to("sip:" + $tU + "@" + $avp(dst_ipaddr));
    uac_replace_from("sip:$avp(fromName)@$avp(dst_ipaddr)");
    uac_replace_to("sip:$tU@$avp(dst_ipaddr)");

    $ru = "sip:" + $rU + "@" + $avp(dst_ipaddr);
    remove_hf("Contact");

    $var(contact) = "sip:" + $avp(fromName) + "@" + $avp(l_ipaddr);
    insert_hf("Contact: <$var(contact)>\r\n", "Call-ID");
}

route[CLASSIFY_SOURCE] {
    if (ds_is_from_list(GATEWAYS_SET)) {
        if is_method("OPTIONS") {
            sl_send_reply(200, "OK");
            exit;
        }
        setsflag(FLAG_INTERNALLY_SOURCED);        
        $avp(direction) = "direction=private direction=public";
        return;
    }
    $avp(direction) = "direction=public direction=private";
}

failure_route[MANAGE_FAILURE] {
    if (t_is_canceled()) {
        exit;
    }
    // if(t_check_status("401|407")) {
    
    if (t_check_status("401|407")) {
        xlog("L_INFO", "[MANAGE_FAILURE] is 401");
        if (uac_auth()) {
            xlog("L_INFO", "[MANAGE_FAILURE] uac_auth - cred found! ok");
            route(RELAY);
            // return 1;
        } else {
            xlog("L_INFO", "[MANAGE_FAILURE] uac_auth - cred not found");
            //return -1;
        }
    }

    if (t_check_status("40[48]|5[0-9][0-9]")) {
        xlog("L_INFO", "[MANAGE_FAILURE] receiv 404/408/5XX response");
        //if (route(DISPATCH)) {
        //    route(RELAY);
        //}
        if (ds_next_dst()) {
            xlog("L_INFO", "[MANAGE_FAILURE] ds_next_dst is OK");
            route(RELAY);
        } else {
            xlog("L_INFO", "[MANAGE_FAILURE] ds_next_dst is fail");
        }
    }

}

branch_route[MANAGE_BRANCH] {
    xlog("L_INFO", "[MANAGE_BRANCH] call SDPMANAGE");
    route(FIXCONTACT);
    route(SDPMANAGE);

}

reply_route {
    //if is_present_hf("Contact") {
    //    xlog("L_INFO", "[reply_route] call NATMANAGE");
    //    route(NATMANAGE);
    //}
    route(FIXCONTACT);
    xlog("L_INFO", "[reply_route] call SDPMANAGE");
    route(SDPMANAGE);
}
