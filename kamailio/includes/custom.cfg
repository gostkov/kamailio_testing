route[OPTIONS_CHECK] {
	if (is_method("OPTIONS")) {
		sl_send_reply("200", "OK");
	}
}

route[AUTH] {
	if (!is_method("REGISTER")) {
		return;
	}
	if (!auth_check("$fd", "subscriber", "1")) {
		auth_challenge("$fd", "0");
		exit;
	}
}

route[REGISTRAR] {
	if (!is_method("REGISTER")) {
		return;
	}

	if (!save("location")) {
		sl_reply_error();
	}
	exit;
}

route[NATMANAGE] {
	force_rport();
	fix_nated_register();
	//fix_nated_contact();
	xlog("L_INFO", "[NATMANAGE] received: $avp(RECEIVED)");
}


route[LOCATION] {
	if (!is_method("INVITE")) {
		return -1;
	}
	lookup("location");
	switch ($retcode) {
	    case -1:		
	    case -3:
        	sl_send_reply("404", "Not Found");
	        exit;
	    case -2:
        	sl_send_reply("405", "Not Found");
	        exit;
	};
	return 1;
}

route[RELAY] {
	if(!t_relay()) {
		sl_reply_error();
	}
	exit;
}
