route[OPTIONS_CHECK] {
    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }
}

route[AUTH] {
    if (is_method("REGISTER") || (from_uri == myself)) {        
        if (!auth_check("$fd", "subscriber", "1")) {
            auth_challenge("$fd", "0");
            exit;
        }
        consume_credentials();
    } else {
        xlog("[AUTH] not register request and not for myself");
        exit;
    }
}

route[REGISTRAR] {
    if (!is_method("REGISTER")) {
        return;
    }

    if (!save("location")) {
        sl_reply_error();
    }
    exit;
}

route[NATMANAGE] {
    xlog("L_INFO", "[NATMANAGE] before received: $avp(RECEIVED)");
    force_rport();
    fix_nated_register();
    //fix_nated_contact();
    xlog("L_INFO", "[NATMANAGE] received: $avp(RECEIVED)");
}


route[LOCATION] {
    if(!lookup("location")) {
        sl_send_reply("404", "Not Found");
        return (-1);
    }
    return (1);
}

route[RELAY] {
    if(!t_relay()) {
        sl_reply_error();
    }
    exit;
}
