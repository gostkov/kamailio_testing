route[TO_PSTN] {
    route(SET_CALLERID);
    if (!cr_route("default", "test", "$rU", "$rU", "call_id")) {
        return (-1);
    }
    xlog("L_INFO", "cr_route working");
}

branch_route[MANAGE_BRANCH] {
    xlog("L_INFO", "[MANAGE_BRANCH] call SDPMANAGE");
    route(SDPMANAGE);
}

reply_route {
    if is_present_hf("Contact") {
        xlog("L_INFO", "[reply_route] call NATMANAGE");
        route(NATMANAGE);
    }
    xlog("L_INFO", "[reply_route] call SDPMANAGE");
    route(SDPMANAGE);
}
